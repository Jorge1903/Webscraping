# Configuracion propuesta; NO esta aplicada al servicio actual.
# Plan Free elegido por el usuario, con persistencia en PostgreSQL independiente.
# PostgreSQL Free de Render caduca a los 30 dias. Respaldar antes del vencimiento.
# En Blueprints, elegir el servicio existente y confirmar su nombre exacto.
services:
  - type: web
    name: Webscraping
    runtime: docker
    repo: https://github.com/Jorge1903/Webscraping
    branch: main
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONITOR_DB_PATH
        value: /app/data/db.json
      - key: DATABASE_URL
        fromDatabase:
          name: webscraping-postgres
          property: connectionString
databases:
  - name: webscraping-postgres
    region: oregon
    plan: free
