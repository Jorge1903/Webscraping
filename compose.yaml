name: webscraping2
services:
  app:
    build: .
    image: webscraping2:local
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MONITOR_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      MONITOR_DB_PATH: /app/data/db.json
      DATABASE_URL: postgresql://monitor:${POSTGRES_PASSWORD:-monitor_local_only}@db:5432/monitor
    volumes:
      - type: bind
        source: ./data
        target: /app/data
    stop_grace_period: 20s
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
